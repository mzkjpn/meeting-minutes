<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>射撃競技会議事録</title>
<style>
:root{--teal:#0f766e;--teal-dark:#115e59;--bg:#f7f7f5;--line:#e7e5e4;--text:#292524;--muted:#78716c;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:9px 13px;font-weight:600}.primary{background:var(--teal);color:white}.primary:hover{background:var(--teal-dark)}.secondary{background:#f0fdfa;color:var(--teal-dark);border:1px solid #ccfbf1}.danger{background:#fff1f2;color:var(--red);border:1px solid #ffe4e6}.plain{background:white;color:#57534e;border:1px solid var(--line)}.wrap{max-width:900px;margin:auto;padding:24px 16px 60px}.top{display:flex;gap:12px;align-items:center;margin-bottom:24px}.logo{background:var(--teal);color:white;border-radius:12px;width:46px;height:46px;display:grid;place-items:center;font-size:24px}.top h1{font-size:23px;margin:0}.sub{font-size:13px;color:var(--muted)}.panel,.minute-card{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 5px #00000005}.panel h2{font-size:18px;margin:0 0 16px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.section-head h2{margin:0}.field{margin-bottom:14px}.field:last-child{margin-bottom:0}label{display:block;font-size:13px;font-weight:650;color:#57534e;margin-bottom:6px}input,textarea,select{width:100%;border:1px solid #d6d3d1;border-radius:8px;padding:10px 11px;background:white;color:var(--text);outline:none}input:focus,textarea:focus,select:focus{border-color:#14b8a6;box-shadow:0 0 0 3px #14b8a61c}textarea{resize:vertical;min-height:100px;white-space:pre-wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.row-card{background:#fafaf9;border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}.row-title{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:12px}.list{display:grid;gap:10px}.minute-card{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.minute-open{background:transparent;padding:0;text-align:left;flex:1}.minute-open strong{display:block;font-size:16px;color:var(--text)}.meta{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;flex-wrap:wrap;gap:8px}.status{font-size:12px;color:var(--teal);min-height:18px;margin-top:8px}.empty{text-align:center;color:var(--muted);border:1px dashed #d6d3d1;border-radius:12px;padding:36px 16px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.hidden{display:none!important}.hint{font-size:12px;color:var(--muted);margin:0 0 12px}.footer-tools{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.notice{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:16px}#fileImport{display:none}@media(max-width:620px){.wrap{padding:18px 12px 40px}.grid,.three{grid-template-columns:1fr}.panel{padding:16px}.top h1{font-size:20px}.minute-card{padding:14px}.toolbar{align-items:flex-start;flex-direction:column}.section-head{align-items:flex-start}}
@media print{body{background:white}.wrap{max-width:none;padding:0}.no-print,button,.top .sub{display:none!important}.panel,.row-card{box-shadow:none;break-inside:avoid}.panel{border:1px solid #bbb}.row-card{background:white}input,textarea,select{border:0;padding:2px;box-shadow:none!important;appearance:none}.view-list{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="logo">◎</div><div><h1>射撃競技会議事録</h1><div class="sub">会議の記録を管理します</div></div></header>
  <section id="authPanel" class="panel no-print">
    <h2>ログイン</h2>
    <p class="hint">同じメールアドレスとパスワードでログインすると、複数端末で同じ議事録を使えます。</p>
    <div class="field"><label for="authEmail">メールアドレス</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></div>
    <div class="field"><label for="authPassword">パスワード</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="パスワード（6文字以上）"></div>
    <div class="actions"><button class="primary" id="loginBtn">ログイン</button><button class="secondary" id="signupBtn">新規登録</button></div>
    <div class="status" id="authStatus" aria-live="polite"></div>
  </section>
  <div id="appArea" class="hidden">
    <div class="toolbar no-print"><div class="sub" id="signedInAs"></div><button class="plain" id="logoutBtn">ログアウト</button></div>
    <div class="notice no-print"><strong>クラウド同期：</strong>議事録はSupabaseに保存されます。同じアカウントでログインしてください。変更は自動保存されます。</div>
  <main id="listView" class="view-list">
    <div class="toolbar"><div><h2 style="margin:0">議事録一覧</h2><div class="sub">このブラウザに保存された議事録</div></div><button class="primary" id="newMinute">＋ 新規議事録作成</button></div>
    <div class="footer-tools no-print"><button class="plain" id="exportAll">バックアップを書き出す（JSON）</button><button class="plain" id="importBtn">バックアップを読み込む</button><input type="file" id="fileImport" accept="application/json,.json"></div>
    <div id="minutesList" class="list"></div>
  </main>
  <main id="detailView" class="hidden">
    <div class="toolbar no-print"><button class="plain" id="backBtn">← 一覧に戻る</button><div class="actions"><button class="plain" id="exportOne">この議事録を保存</button><button class="plain" id="printBtn">印刷</button></div></div>
    <section class="panel">
      <h2>基本情報</h2>
      <div class="field"><label for="title">タイトル</label><input id="title" placeholder="議事録のタイトル"></div>
      <div class="grid"><div class="field"><label for="meetingDate">開催日</label><input type="date" id="meetingDate"></div><div class="field"><label for="location">場所</label><input id="location" placeholder="射場名など"></div></div>
      <div class="field"><label for="competitionName">大会名</label><input id="competitionName" placeholder="大会名"></div>
      <div class="field"><label for="notes">備考</label><textarea id="notes" rows="3" placeholder="備考・特記事項"></textarea></div>
      <div class="status" id="saveStatus" aria-live="polite">自動保存されます</div>
    </section>
    <section class="panel"><div class="section-head"><h2>種目別情報</h2><button class="secondary no-print" id="addEvent">＋ 追加</button></div><p class="hint">種目と射群番号を選択し、射場長名を入力してください。</p><div id="events"></div></section>
    <section class="panel"><div class="section-head"><h2>議事項目</h2><button class="secondary no-print" id="addSection">＋ 追加</button></div><p class="hint">セクションは複数行で自由に記述できます。</p><div id="sections"></div></section>
    <section class="panel"><div class="section-head"><h2>ジュリーコメント</h2><button class="secondary no-print" id="addComment">＋ 追加</button></div><p class="hint">コメントごとにジュリー名を記録できます。</p><div id="comments"></div></section>
    <div class="footer-tools no-print"><button class="plain" id="exportOneBottom">この議事録をバックアップ</button><button class="danger" id="deleteCurrent">この議事録を削除</button></div>
  </main>
  </div><!-- appArea -->
</div>
<script>
(()=>{
 const SUPABASE_URL='https://vlitictwbtxylhpjpzea.supabase.co';
 const SUPABASE_KEY='sb_publishable_ken0LmE9Vw3FXWFn57KdEA_cqyRA_oW';
 const KEY='shooting-meeting-minutes-v1';
 const SESSION_KEY='shooting-meeting-supabase-session-v1';
 const DEFAULT_SECTIONS=['開会挨拶','出席者','審議事項','運営事項','その他'];
 let minutes=[], currentId=null, saveTimer=null, session=null, remoteBusy=false, pollTimer=null;
 const $=id=>document.getElementById(id);
 const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(16).slice(2);
 const now=()=>new Date().toISOString();
 const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function setAuthMessage(msg,isError=false){$('authStatus').textContent=msg;$('authStatus').style.color=isError?'#b91c1c':'#0f766e'}
 function setSession(s){session=s;if(s)localStorage.setItem(SESSION_KEY,JSON.stringify(s));else localStorage.removeItem(SESSION_KEY);}
 async function authRequest(path,body){const r=await fetch(SUPABASE_URL+'/auth/v1/'+path,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.msg||d.message||d.error_description||d.error||'認証に失敗しました');return d}
 async function signup(){const email=$('authEmail').value.trim(),password=$('authPassword').value;if(!email||!password){setAuthMessage('メールアドレスとパスワードを入力してください。',true);return}if(password.length<6){setAuthMessage('パスワードは6文字以上にしてください。',true);return}try{$('signupBtn').disabled=true;setAuthMessage('登録中…');const d=await authRequest('signup',{email,password});if(d.access_token){setSession(d);await afterLogin()}else{setAuthMessage('登録を受け付けました。確認メールが届いた場合はメール内のリンクを開いてからログインしてください。')} }catch(e){setAuthMessage(e.message,true)}finally{$('signupBtn').disabled=false}}
 async function login(){const email=$('authEmail').value.trim(),password=$('authPassword').value;if(!email||!password){setAuthMessage('メールアドレスとパスワードを入力してください。',true);return}try{$('loginBtn').disabled=true;setAuthMessage('ログイン中…');const d=await authRequest('token?grant_type=password',{email,password});setSession(d);await afterLogin()}catch(e){setAuthMessage(e.message+'（メール確認が必要な場合は、確認メールを開いてください）',true)}finally{$('loginBtn').disabled=false}}
 async function refreshSession(){if(!session?.refresh_token)return false;try{const d=await authRequest('token?grant_type=refresh_token',{refresh_token:session.refresh_token});setSession(d);return true}catch{return false}}
 async function api(path,options={},retry=true){if(!session?.access_token)throw new Error('ログインしてください');const headers={apikey:SUPABASE_KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',...(options.headers||{})};let r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...options,headers});if(r.status===401&&retry&&await refreshSession())return api(path,options,false);const text=await r.text();if(!r.ok)throw new Error(text||('Supabase error '+r.status));return text?JSON.parse(text):null}
 async function afterLogin(){ $('authPanel').classList.add('hidden');$('appArea').classList.remove('hidden');$('signedInAs').textContent='ログイン中：'+(session.user?.email||'アカウント');try{await loadRemote();renderList();setAuthMessage('')}catch(e){$('authPanel').classList.remove('hidden');$('appArea').classList.add('hidden');setAuthMessage('データ読み込みに失敗しました：'+e.message,true);return}if(pollTimer)clearInterval(pollTimer);pollTimer=setInterval(()=>{if(session&&!currentId&&!remoteBusy)loadRemote().then(renderList).catch(()=>{})},10000)}
 async function logout(){if(pollTimer)clearInterval(pollTimer);pollTimer=null;setSession(null);minutes=[];currentId=null;$('detailView').classList.add('hidden');$('listView').classList.remove('hidden');$('appArea').classList.add('hidden');$('authPanel').classList.remove('hidden');setAuthMessage('ログアウトしました。')}
 async function loadRemote(){if(!session)return;remoteBusy=true;try{const rows=await api('meeting_minutes?select=id,data,updated_at&order=updated_at.desc');minutes=(rows||[]).map(r=>({...r.data,id:r.id,updated_at:r.updated_at||r.data?.updated_at||''}));localStorage.setItem(KEY,JSON.stringify(minutes))}finally{remoteBusy=false}}
 async function persist(){if(!session)return;const snapshot=minutes.map(m=>({...m}));if(currentId)$('saveStatus').textContent='クラウドに保存中…';try{await api('meeting_minutes?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(snapshot.map(m=>({id:m.id,data:m,updated_at:m.updated_at||now()})))});localStorage.setItem(KEY,JSON.stringify(minutes));if(currentId)$('saveStatus').textContent='クラウドに保存しました '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});renderList()}catch(e){if(currentId)$('saveStatus').textContent='保存エラー：'+e.message;console.error(e)}}
 function scheduleSave(){clearTimeout(saveTimer);$('saveStatus').textContent='保存待ち…';saveTimer=setTimeout(persist,500)}
 function current(){return minutes.find(m=>m.id===currentId)}
 function newMinute(){const m={id:uid(),title:'新規議事録',meeting_date:'',location:'',competition_name:'',notes:'',created_at:now(),updated_at:now(),events:[],sections:DEFAULT_SECTIONS.map((name,i)=>({id:uid(),name,content:'',sort_order:i})),comments:[]};minutes.unshift(m);currentId=m.id;persist();openDetail(m.id)}
 function renderList(){const host=$('minutesList');if(!minutes.length){host.innerHTML='<div class="empty">議事録がありません。<br>「新規議事録作成」から始めてください。</div>';return}host.innerHTML=minutes.slice().sort((a,b)=>(b.updated_at||'').localeCompare(a.updated_at||'')).map(m=>`<article class="minute-card"><button class="minute-open" data-open="${escapeHtml(m.id)}"><strong>${escapeHtml(m.title||'無題')}</strong><div class="meta">${escapeHtml(m.meeting_date||'開催日未設定')} ・ 更新：${m.updated_at?new Date(m.updated_at).toLocaleString('ja-JP'):'-'}</div></button><button class="danger" data-delete="${escapeHtml(m.id)}" aria-label="削除">削除</button></article>`).join('');host.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDetail(b.dataset.open));host.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteMinute(b.dataset.delete))}
 function openDetail(id){currentId=id;const m=current();if(!m)return;$('listView').classList.add('hidden');$('detailView').classList.remove('hidden');$('title').value=m.title||'';$('meetingDate').value=m.meeting_date||'';$('location').value=m.location||'';$('competitionName').value=m.competition_name||'';$('notes').value=m.notes||'';renderEvents();renderSections();renderComments();$('saveStatus').textContent='自動保存されます';window.scrollTo(0,0)}
 function back(){currentId=null;$('detailView').classList.add('hidden');$('listView').classList.remove('hidden');renderList();window.scrollTo(0,0)}
 function updateBasic(){const m=current();if(!m)return;m.title=$('title').value;m.meeting_date=$('meetingDate').value;m.location=$('location').value;m.competition_name=$('competitionName').value;m.notes=$('notes').value;m.updated_at=now();scheduleSave()}
 ['title','meetingDate','location','competitionName','notes'].forEach(id=>$(id).addEventListener('input',updateBasic));
 function renderEvents(){const m=current();$('events').innerHTML=m.events.length?m.events.map((e,i)=>`<div class="row-card"><div class="row-title"><span>種目 ${i+1}</span><button class="danger no-print" data-event-del="${escapeHtml(e.id)}">削除</button></div><div class="grid three"><div class="field"><label>種目</label><select data-event="${escapeHtml(e.id)}" data-field="event_name"><option value="">— 選択 —</option><option ${e.event_name==='AR'?'selected':''} value="AR">AR</option><option ${e.event_name==='BR'?'selected':''} value="BR">BR</option></select></div><div class="field"><label>射群番号</label><select data-event="${escapeHtml(e.id)}" data-field="shooting_group_number"><option value="">— 選択 —</option>${Array.from({length:10},(_,n)=>String(n+1)).map(n=>`<option value="${n}" ${String(e.shooting_group_number)===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>射場長名</label><input data-event="${escapeHtml(e.id)}" data-field="range_officer_name" value="${escapeHtml(e.range_officer_name)}" placeholder="射場長のお名前"></div></div></div>`).join(''):'<div class="empty">種目レコードがありません。「追加」から追加してください。</div>'; $('events').querySelectorAll('[data-event]').forEach(el=>el.addEventListener('change',()=>{const e=current().events.find(x=>x.id===el.dataset.event);if(e){e[el.dataset.field]=el.value;touch()}}));$('events').querySelectorAll('[data-event-del]').forEach(b=>b.onclick=()=>{if(confirm('この種目レコードを削除しますか？')){current().events=current().events.filter(e=>e.id!==b.dataset.eventDel);touch();renderEvents()}})}
 function renderSections(){const m=current();$('sections').innerHTML=m.sections.length?m.sections.map((s,i)=>`<div class="row-card"><div class="row-title"><span>項目 ${i+1}</span><button class="danger no-print" data-section-del="${escapeHtml(s.id)}">削除</button></div><div class="field"><label>項目名</label><input data-section="${escapeHtml(s.id)}" data-field="name" value="${escapeHtml(s.name)}" placeholder="項目名（例：審議事項）"></div><div class="field"><label>内容</label><textarea data-section="${escapeHtml(s.id)}" data-field="content" rows="4" placeholder="内容を入力（複数行可能）">${escapeHtml(s.content)}</textarea></div></div>`).join(''):'<div class="empty">セクションがありません。</div>'; $('sections').querySelectorAll('[data-section]').forEach(el=>el.addEventListener('input',()=>{const s=current().sections.find(x=>x.id===el.dataset.section);if(s){s[el.dataset.field]=el.value;touch()}}));$('sections').querySelectorAll('[data-section-del]').forEach(b=>b.onclick=()=>{if(confirm('このセクションを削除しますか？')){current().sections=current().sections.filter(s=>s.id!==b.dataset.sectionDel);touch();renderSections()}})}
 function renderComments(){const m=current();$('comments').innerHTML=m.comments.length?m.comments.map((c,i)=>`<div class="row-card"><div class="row-title"><span>コメント ${i+1}</span><button class="danger no-print" data-comment-del="${escapeHtml(c.id)}">削除</button></div><div class="field"><label>コメント</label><textarea rows="3" data-comment="${escapeHtml(c.id)}" data-field="comment" placeholder="ジュリーコメントを入力">${escapeHtml(c.comment)}</textarea></div><div class="field"><label>ジュリー名</label><input data-comment="${escapeHtml(c.id)}" data-field="jury_name" value="${escapeHtml(c.jury_name)}" placeholder="ジュリーのお名前"></div></div>`).join(''):'<div class="empty">ジュリーコメントがありません。</div>'; $('comments').querySelectorAll('[data-comment]').forEach(el=>el.addEventListener('input',()=>{const c=current().comments.find(x=>x.id===el.dataset.comment);if(c){c[el.dataset.field]=el.value;touch()}}));$('comments').querySelectorAll('[data-comment-del]').forEach(b=>b.onclick=()=>{if(confirm('このジュリーコメントを削除しますか？')){current().comments=current().comments.filter(c=>c.id!==b.dataset.commentDel);touch();renderComments()}})}
 function touch(){const m=current();if(m)m.updated_at=now();scheduleSave()}
 $('newMinute').onclick=newMinute;$('backBtn').onclick=back;$('addEvent').onclick=()=>{current().events.push({id:uid(),event_name:'',shooting_group_number:'',range_officer_name:''});touch();renderEvents()};$('addSection').onclick=()=>{current().sections.push({id:uid(),name:'',content:'',sort_order:current().sections.length});touch();renderSections()};$('addComment').onclick=()=>{current().comments.push({id:uid(),comment:'',jury_name:''});touch();renderComments()};
 async function deleteMinute(id){if(!confirm('この議事録を削除しますか？この操作は取り消せません。'))return;try{await api('meeting_minutes?id=eq.'+encodeURIComponent(id),{method:'DELETE'});minutes=minutes.filter(m=>m.id!==id);if(currentId===id)back();else renderList()}catch(e){alert('削除に失敗しました：'+e.message)}}
 $('deleteCurrent').onclick=()=>{if(currentId)deleteMinute(currentId)};$('printBtn').onclick=()=>window.print();
 function download(data,name){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
 function exportCurrent(){const m=current();if(!m)return;download({format:'shooting-meeting-minutes-v1',minutes:[m]},`議事録_${(m.title||'backup').replace(/[\\/:*?"<>|]/g,'_')}.json`)}
 $('exportAll').onclick=()=>download({format:'shooting-meeting-minutes-v1',minutes},'議事録バックアップ.json');$('exportOne').onclick=exportCurrent;$('exportOneBottom').onclick=exportCurrent;$('importBtn').onclick=()=>$('fileImport').click();
 $('fileImport').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());const imported=Array.isArray(data)?data:data.minutes;if(!Array.isArray(imported))throw new Error('ファイル形式が違います');if(!confirm(`${imported.length}件の議事録を読み込みます。既存データに追加しますか？`))return;const ids=new Set(minutes.map(m=>m.id));for(const m of imported){if(ids.has(m.id))m.id=uid();(m.sections||[]).forEach(s=>{if(!s.id)s.id=uid()});(m.events||m.event_fields||[]).forEach(x=>{if(!x.id)x.id=uid()});(m.comments||m.jury_comments||[]).forEach(x=>{if(!x.id)x.id=uid()});if(!m.events)m.events=(m.event_fields||[]).map(x=>({id:x.id,event_name:x.event_name||'',shooting_group_number:x.shooting_group_number||'',range_officer_name:x.range_officer_name||''}));if(!m.comments)m.comments=(m.jury_comments||[]).map(x=>({id:x.id,comment:x.comment||'',jury_name:x.jury_name||''}));m.updated_at=now();minutes.unshift(m);await persist()}alert('読み込みました。')}catch(err){alert('読み込みに失敗しました：'+err.message)}finally{$('fileImport').value=''}};
 $('loginBtn').onclick=login;$('signupBtn').onclick=signup;$('logoutBtn').onclick=logout;
 async function init(){try{const s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');if(s?.access_token){setSession(s);if(s.expires_at&&s.expires_at*1000<Date.now())await refreshSession();await afterLogin()}else{setSession(null);$('authPanel').classList.remove('hidden');$('appArea').classList.add('hidden')}}catch(e){setSession(null);$('authPanel').classList.remove('hidden');$('appArea').classList.add('hidden');setAuthMessage('初期化に失敗しました：'+e.message,true)}}
 init();
})();
</script>
</body>
</html>
